services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stream_api
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./batch-program/collect-socket/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-donations.sql:ro
      - ./api-server/schema.sql:/docker-entrypoint-initdb.d/02-api.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collect-socket:
    build: ./batch-program/collect-socket
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/stream_api?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: change-me
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-server:
    build: ./api-server
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: stream_api
      DB_USER: root
      DB_PASSWORD: change-me
      REDIS_URL: redis://redis:6379
      ADMIN_SECRET: change-admin-secret
      INTERNAL_SECRET: change-internal-secret
      JWT_SECRET: change-this-jwt-secret-before-production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-frontend:
    build:
      context: ./api-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - api-server

volumes:
  mysql-data:
  redis-data:
